[Commands]
1\Name=全文抓取到 Obsidian 📥
1\Command="
    copyq:
    // ==================== ⚙️ 配置区 ====================
    // 1. fetcher 项目路径
    var WORK_DIR = 'D:/Code/Python/fetcher';
    var PYTHON_EXE = WORK_DIR + '/.venv/Scripts/python.exe';
    var SCRIPT_PATH = WORK_DIR + '/fetcher.py';

    // 2. Markdown 存储位置 (Obsidian 库路径)
    var MD_DIR = 'F:/MyObsidian/IPARA/03-Resources/Fetcher';
    
    // 3. 图片存储位置 (Obsidian 附件路径)
    var IMG_DIR = MD_DIR + '/images';
    // ===================================================

    var url = str(clipboard()).trim();
    if (!/^https?:\\/\\//i.test(url)) {
        popup('❌ 错误', '剪贴板内容不是有效的链接！');
        abort();
    }

    // 提示：全文下载包含图片处理，耗时较长
    popup('🚀 开始深度抓取', '正在下载全文并转码图片，请稍后...\\n' + url, 4000);

    // 使用 uv run --directory 设置工作目录，自动使用项目 .venv
    // 不经过 cmd，URL 中的 & 不会被误解析
    var res = execute('uv', 'run', '--directory', WORK_DIR, 'python', '-X', 'utf8', SCRIPT_PATH, '"' + url + '"', '-o', MD_DIR, '-i', IMG_DIR, '--no-date-prefix');

    var rawOutput = str(res.stdout).trim() || str(res.stderr).trim();

    if (res.exit_code === 0 && rawOutput.length > 0) {
        // 脚本第一行通常是抓取到的文章标题
        var title = rawOutput.split(/[\\r\\n]+/)[0].trim();
        
        // 弹出成功提示
        popup('✅ 抓取保存成功', '标题：' + title + '\\n已存入 Obsidian Fetcher 文件夹 (无日期前缀)', 5000);

    } else {
        var errMsg = rawOutput || '未知错误（无输出）';
        popup('❌ 抓取失败', '错误信息：\\n' + errMsg, 6000);
    }"
1\InMenu=true
1\IsGlobalShortcut=true
1\Icon=📥
1\GlobalShortcut=ctrl+shift+d